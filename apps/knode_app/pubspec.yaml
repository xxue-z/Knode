name: knode_app
description: 知维 - 个人知识管理 Flutter 应用
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  monolith_localization_runtime: ^1.0.1
  core:
    path: ../../packages/core
  wiki:
    path: ../../packages/wiki
  chat:
    path: ../../packages/chat
  quiz:
    path: ../../packages/quiz
  micro_server:
    path: ../../packages/micro_server
  sqflite: ^2.3.0
  path: ^1.9.1
  doc_text_extractor: ^2.1.0
  file_picker: ^11.0.2
  pdf: ^3.12.0
  archive: ^4.0.9
  share_plus: ^12.0.2
  dio: ^5.9.2
  llama_cpp_dart: ^0.2.2
  flutter_secure_storage: ^10.3.1
  crypto: ^3.0.0
  path_provider: ^2.1.0
  go_router: ^17.2.3
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/web/
